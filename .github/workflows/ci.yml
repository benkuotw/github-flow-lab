# Workflow name shown in the Actions tab
name: CI

# WHEN to run: on every PR, and on every push to main (i.e. after a merge)
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job only needs to read the code
permissions:
  contents: read

jobs:
  shellcheck:                 # job id
    name: shellcheck          # check name; the ruleset will require this exact name
    runs-on: ubuntu-latest    # fresh GitHub-hosted Ubuntu VM, thrown away after the run
    steps:
      # Step 1: clone your repo into the runner (it starts empty)
      - uses: actions/checkout@v5

      # Step 2: lint every script; a non-zero exit code fails the job
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh
